name: GUIShop
main: com.pablo67340.guishop.GUIShop
version: ${project.version}
author: pablo67340
description: Shop plugin for any server.
depend: [ Vault ]
softdepend: [ PlaceholderAPI, packetevents ]
api-version: 1.13
folia-supported: true

permissions:
  guishop.use:
    default: op
    description: Grants access to GUIShop
  guishop.shop.*:
    default: op
    description: Grants access to specific items in shop
  guishop.reload:
    default: op
    description: Grants access to reload shops
  guishop.creator:
    default: op
    description: Grants access to the GUIShop creator
  guishop.economy.balance:
    default: true
    description: Grants access to /bal command
  guishop.economy.balance.others:
    default: op
    description: Allows checking other players' balances
  guishop.economy.pay:
    default: true
    description: Grants access to /pay command

commands:
  guishop:
    description: Base GUIShop command. Displays help.
    permission: guishop.use
    aliases: gs
  guishopuser:
    description: GUIShop alias for buy commands.
    permission: guishop.use
  # Note: /bal, /pay, /togglepay are dynamically registered only when internal economy is enabled